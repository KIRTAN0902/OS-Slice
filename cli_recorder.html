  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100vw;
      height: 100vh;
      background-color: #0c1017;
      font-family: "Cascadia Code", "Fira Code", Consolas, "Courier New", monospace;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Windows Terminal Title Bar */
    .terminal-titlebar {
      height: 42px;
      background-color: #161b22;
      border-bottom: 1px solid #30363d;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      user-select: none;
    }
    .tab-bar {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .terminal-tab {
      background-color: #0c1017;
      color: #e6edf3;
      padding: 8px 20px;
      border-radius: 6px 6px 0 0;
      font-size: 13.5px;
      font-weight: 500;
      border-top: 2px solid #38bdf8;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .terminal-tab .tab-icon {
      color: #38bdf8;
      font-size: 14px;
    }
    .window-controls {
      display: flex;
      gap: 18px;
      color: #8b949e;
      font-size: 14px;
    }

    /* Terminal Body Screen */
    .terminal-content {
      flex: 1;
      padding: 24px 38px;
      overflow-y: auto;
      background-color: #0c1017;
      color: #e6edf3;
      font-size: 14.2px;
      line-height: 1.42;
    }

    .terminal-content::-webkit-scrollbar {
      display: none;
    }

    #cli-screen {
      white-space: pre;
    }
    pre, code {
      font-family: inherit !important;
      background: transparent !important;
    }

    .prompt-line {
      display: flex;
      align-items: center;
      margin-top: 14px;
      font-size: 14.5px;
    }
    .prompt-tag {
      color: #38bdf8;
      font-weight: 700;
      margin-right: 8px;
    }
    .user-input {
      color: #f0f6fc;
      font-weight: 600;
    }
    .cursor {
      display: inline-block;
      width: 9px;
      height: 18px;
      background-color: #38bdf8;
      margin-left: 2px;
      animation: blink 0.8s infinite;
      vertical-align: middle;
    }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
  </style>
</head>
